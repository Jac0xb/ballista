{
    // Rules with a known or suspected blocker, with their reachability rules and twins, and the
    // memory-model diagnostics. certora/README.md gives each blocker. Expect failures. A rule that
    // passes here counts only if its twin fails and its reachability rules pass: a suspected
    // blocker can turn out not to bite, and the diagnostics say which.
    "msg": "Ballista: blocked rules and diagnostics (results not meaningful)",
    // Every conf uses the same prover settings:
    // - unsatCoresForAllAsserts: report which assumptions each proof used.
    // - solanaSkipCallRegInst: skip indirect calls. The binary's only `callx` are in core::fmt,
    //   which is never inlined and runs only on panic and Debug paths.
    // - solanaTACOptimize 2: the front end's own TAC optimizations.
    // - solanaStackSize 4096: SBPF v0's frame. The prover then stops at any access past 4 KiB
    //   instead of modelling a frame the chain never gives; build-sbf.sh fails the build first.
    //   The confs used 8192 while invoke_cpi's frame was 4,736 bytes, before 1246a0f.
    // - solanaTACMathInt: exact mathematical-integer summaries of compiler-rt's __multi3 and
    //   __udivti3, which the u128 and mul_div rules depend on.
    "loop_iter": "8",
    "optimistic_loop": false,
    "smt_timeout": "6000",
    "cargo_tools_version": "v1.53",
    "rule_sanity": "basic",
    "java_args": [
        "-Dlevel.sbf=info"
    ],
    "prover_args": [
        "-unsatCoresForAllAsserts true",
        "-solanaSkipCallRegInst true",
        "-solanaTACOptimize 2",
        "-solanaStackSize 4096",
        "-solanaTACMathInt true"
    ],
    "rule": [
        "rule_heap_byte_stores_read_back_as_words",
        "rule_constant_program_parses_from_byte_stores",
        "rule_constant_program_parses_from_memcpy",
        "rule_stack_word_copy_keeps_the_code_after_a_short_tag",
        "rule_stack_word_copy_keeps_a_short_tag",
        "rule_u64_mul_div_is_exact",
        "rule_u64_mul_div_reaches_a_quotient",
        "rule_u64_mul_div_reaches_division_by_zero",
        "rule_u64_mul_div_reaches_overflow",
        "rule_u64_mul_div_twin_is_off_by_one",
        "rule_signer_constraints_require_signers",
        "rule_signer_constraints_reach_acceptance",
        "rule_signer_constraints_reach_a_missing_signature",
        "rule_signer_constraints_twin_accept_non_signers",
        "rule_writable_and_executable_constraints_are_enforced",
        "rule_writable_and_executable_constraints_reach_acceptance",
        "rule_writable_and_executable_constraints_reach_a_refusal",
        "rule_writable_and_executable_constraints_twin_accept_misses",
        "rule_pinned_address_and_owner_are_enforced",
        "rule_pinned_address_and_owner_reach_acceptance",
        "rule_pinned_address_and_owner_reach_a_refusal",
        "rule_pinned_address_and_owner_twin_accept_strangers",
        "rule_minimum_data_length_is_enforced",
        "rule_minimum_data_length_reaches_acceptance",
        "rule_minimum_data_length_reaches_a_refusal",
        "rule_minimum_data_length_twin_is_strict",
        "rule_account_count_must_match_the_schema",
        "rule_account_count_reaches_acceptance",
        "rule_account_count_reaches_a_wrong_count",
        "rule_account_count_twin_wants_two",
        "rule_account_header_reads_return_the_account_fields",
        "rule_account_header_reads_twin_return_another_value",
        "rule_registry_open_refuses_an_open_entry",
        "rule_registry_open_twin_refuses_a_fresh_entry",
        "rule_verified_pure_instructions_preserve_register_typing",
        "rule_verified_pure_instructions_reach_success",
        "rule_verified_pure_instructions_reach_a_value_error",
        "rule_verified_pure_instructions_twin_always_succeed",
        "rule_verified_account_reads_preserve_register_typing",
        "rule_verified_account_reads_reach_success",
        "rule_verified_account_reads_reach_a_value_error",
        "rule_verified_account_reads_twin_always_succeed",
        "rule_finalized_templates_reject_chunk_writes",
        "rule_finalized_templates_cannot_be_cancelled",
        "rule_uploading_templates_never_run",
        "rule_run_never_writes_the_template_account",
        "rule_cpi_requests_stay_within_declared_privileges",
        "rule_cpi_requests_reach_an_accepted_listed_account",
        "rule_cpi_requests_reach_a_signer_request",
        "rule_cpi_requests_twin_never_ask_for_a_signer"
    ]
}
