{
    // New and rewritten rules expected to prove, with their reachability rules. Each is checked
    // here against the compiled code for the memory-width problems in certora/README.md. The job
    // at cb2fb2d verified every rule here; its two violations, both prover artifacts, moved to
    // run-blocked.conf, which only reports. Their twins, which must fail, are in run-twins.conf.
    "msg": "Ballista: candidates expected to prove",
    // Every conf uses the same prover settings:
    // - unsatCoresForAllAsserts: report which assumptions each proof used.
    // - solanaSkipCallRegInst: skip indirect calls. The binary's only `callx` are in core::fmt,
    //   which is never inlined and runs only on panic and Debug paths.
    // - solanaTACOptimize 2: the front end's own TAC optimizations.
    // - solanaStackSize 4096: SBPF v0's frame. The prover then stops at any access past 4 KiB
    //   instead of modelling a frame the chain never gives; build-sbf.sh fails the build first.
    //   The confs used 8192 while invoke_cpi's frame was 4,736 bytes, before 1246a0f.
    // - solanaTACMathInt: exact mathematical-integer summaries of compiler-rt's __multi3 and
    //   __udivti3, which the u128 and mul_div rules depend on.
    "loop_iter": "8",
    "optimistic_loop": false,
    "smt_timeout": "6000",
    "cargo_tools_version": "v1.53",
    "rule_sanity": "basic",
    "java_args": [
        "-Dlevel.sbf=info"
    ],
    "prover_args": [
        "-unsatCoresForAllAsserts true",
        "-solanaSkipCallRegInst true",
        "-solanaTACOptimize 2",
        "-solanaStackSize 4096",
        "-solanaTACMathInt true"
    ],
    "rule": [
        "rule_u128_add_is_checked",
        "rule_u128_add_reaches_a_sum",
        "rule_u128_sub_is_checked",
        "rule_u128_sub_reaches_a_difference",
        "rule_u128_sub_reaches_overflow",
        "rule_u128_mul_is_checked",
        "rule_u128_mul_reaches_a_product",
        "rule_u128_mul_reaches_overflow",
        "rule_u128_div_is_checked",
        "rule_u128_div_reaches_a_quotient",
        "rule_u128_div_reaches_division_by_zero",
        "rule_u128_min_is_exact",
        "rule_u128_min_reaches_a_result",
        "rule_u128_max_is_exact",
        "rule_u128_max_reaches_a_result",
        "rule_u128_to_i64_cast_succeeds_exactly_when_the_value_fits",
        "rule_u128_to_i64_cast_reaches_a_value",
        "rule_u128_to_i64_cast_reaches_overflow",
        "rule_registry_open_requires_a_writable_entry",
        "rule_registry_open_checks_the_entry_size",
        "rule_registry_open_reaches_a_wrong_size",
        "rule_registry_fields_need_an_open_entry",
        "rule_return_data_comes_from_the_invoked_program",
        "rule_return_data_from_the_invoked_program_is_read",
        "rule_return_data_reaches_a_refusal",
        "rule_return_data_needs_an_invoke",
        "rule_heap_word_stores_read_back_as_words"
    ]
}
