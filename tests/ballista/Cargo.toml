[package]
name = "ballista-integration-tests"
version = "1.0.0"
edition = "2021"
publish = false

[workspace]

[features]
# Loads `target/deploy/ballista-cu-profile.so` and prints the phase breakdown.
cu-profile = []
# Critic tooling: with `SBF_TRACE_DIR` set, Mollusk writes a register trace (program counter
# included) for every SBF invocation, which `scripts/critic/sbf_coverage.py` turns into coverage.
sbf-trace = ["mollusk-svm/register-tracing"]

[dependencies]
ballista-common = { path = "../../common", features = ["proptest"] }
ballista-fuzz-gen = { path = "../../fuzz-executor/gen" }
base64 = "=0.22.1"
proptest = "1.11"
mollusk-svm = { version = "=0.14.0", features = ["inner-instructions", "precompiles"] }
mollusk-svm-programs-token = { version = "=0.14.0", default-features = false, features = ["associated-token", "token"] }
mollusk-svm-bencher = "=0.14.0"
mollusk-svm-programs-memo = "=0.14.0"
ed25519-dalek = "=1.0.1"
solana-account = "=4.3.1"
solana-address = "=2.6.1"
solana-fee-calculator = "=3.2.2"
solana-hash = "=4.4.0"
solana-instruction = "=3.4.0"
solana-message = "=4.2.3"
solana-nonce = "=3.2.0"
solana-pubkey = "=4.2.0"
solana-program-error = "=3.0.1"
solana-program-option = "=3.1.0"
solana-reward-info = "=6.2.0"
solana-sdk-ids = "=3.1.0"
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }
serde_json = "1"
solana-short-vec = "=3.2.2"
solana-signature = "=3.4.1"
solana-svm-log-collector = { version = "=4.1.1", features = ["agave-unstable-api"] }
solana-system-program = { version = "=4.1.1", features = ["agave-unstable-api"] }
solana-transaction = "=4.1.2"
spl-token-interface = "=2.0.0"
wincode = "=0.5.4"
zerocopy = "=0.8.56"

[[bench]]
name = "compute_units"
harness = false
