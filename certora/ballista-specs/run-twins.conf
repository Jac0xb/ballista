{
    // Twins that MUST FAIL. Each states its rule's property with one deliberate error, on the same
    // paths, so the prover has to report a violation. A twin that passes means its rule passes for
    // a reason other than the program: an unreachable branch, an over-strong assumption, or a
    // value the model leaves unconstrained. Run it next to run.conf and run-candidates.conf.
    "msg": "Ballista: twins that must fail",
    // Every conf uses the same prover settings:
    // - unsatCoresForAllAsserts: report which assumptions each proof used.
    // - solanaSkipCallRegInst: skip indirect calls. The binary's only `callx` are in core::fmt,
    //   which is never inlined and runs only on panic and Debug paths.
    // - solanaTACOptimize 2: the front end's own TAC optimizations.
    // - solanaStackSize 4096: SBPF v0's frame. The prover then stops at any access past 4 KiB
    //   instead of modelling a frame the chain never gives; build-sbf.sh fails the build first.
    //   The confs used 8192 while invoke_cpi's frame was 4,736 bytes, before 1246a0f.
    // - solanaTACMathInt: exact mathematical-integer summaries of compiler-rt's __multi3 and
    //   __udivti3, which the u128 and mul_div rules depend on.
    "loop_iter": "8",
    "optimistic_loop": false,
    "smt_timeout": "6000",
    "cargo_tools_version": "v1.53",
    "rule_sanity": "basic",
    "java_args": [
        "-Dlevel.sbf=info"
    ],
    "prover_args": [
        "-unsatCoresForAllAsserts true",
        "-solanaSkipCallRegInst true",
        "-solanaTACOptimize 2",
        "-solanaStackSize 4096",
        "-solanaTACMathInt true"
    ],
    "rule": [
        "rule_parsed_sections_twin_counts_only_fixed_inputs",
        "rule_u128_add_twin_is_off_by_one",
        "rule_u128_sub_twin_is_off_by_one",
        "rule_u128_mul_twin_is_off_by_one",
        "rule_u128_div_twin_is_off_by_one",
        "rule_u128_min_twin_is_off_by_one",
        "rule_u128_max_twin_is_off_by_one",
        "rule_u128_to_i64_cast_twin_misses_the_boundary",
        "rule_registry_open_twin_refuses_a_writable_entry_too",
        "rule_registry_open_twin_refuses_the_right_size",
        "rule_registry_fields_twin_unchanged_on_an_open_entry",
        "rule_return_data_twin_reads_another_program",
        "rule_return_data_twin_refuses_after_an_invoke",
        "rule_cpi_requests_twin_never_ask_for_a_signer"
    ]
}
