[package]
name = "ballista-protocol-tests"
version = "1.0.0"
edition = "2021"
publish = false

[workspace]   # its own workspace; the root Cargo.toml excludes "tests/protocols"

[dependencies]
ballista-sdk = { path = "../../clients/rust" }       # unchanged SDK; types line up natively
# LiteSVM master after "chore: bump agave crates to 4.3 (#425)": the first LiteSVM whose pins
# (solana-instruction ~3.5, solana-address ~2.7, Agave 4.3 = mainnet) agree with solana-program 4.1.0.
# Move to the crates.io release that contains this commit once it is published.
# `precompiles` loads the Ed25519, secp256k1 and secp256r1 precompiles, which the signed-quote
# scenario's Ed25519 instruction needs. Through agave-precompiles and solana-secp256r1-program's
# `openssl-vendored`, it builds OpenSSL from source: that takes perl, make and a C compiler.
litesvm = { git = "https://github.com/LiteSVM/litesvm", rev = "6a550a1000138cf8a285fac98a17c88ba5b2ad5b", features = ["precompiles"] }
# Major-only carets: cargo unifies each with the version litesvm pins. Commit Cargo.lock.
solana-account = "4"
solana-address = { version = "2", features = ["copy", "curve25519", "decode"] }  # Copy, PDAs, base58
solana-clock = "3"
solana-compute-budget-interface = "3"
solana-ed25519-program = "3"  # Solana's own Ed25519 instruction builder, to check the ported one
solana-epoch-schedule = { version = "3", features = ["sysvar", "wincode"] }  # mainnet's, without warmup
solana-instruction = "3"
solana-keypair = "3"
solana-message = "4"
solana-precompile-error = "3"  # names the Ed25519 precompile's failures
solana-sdk-ids = "3"          # bpf_loader_upgradeable, address_lookup_table, sysvar ids
solana-signer = "3"
solana-transaction = { version = "4", features = ["wincode"] }  # wire-size assertion
wincode = "0.6"               # must equal solana-transaction 4.3's wincode major
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"                 # verify manifest hashes
# Kamino Lend's instruction builders and account layouts, at the build deployed on mainnet
# (verify.osec.io: Kamino-Finance/klend@a08760976f = release/v1.25.0). crates.io's 0.6.0 predates
# it. It speaks solana 2.x; src/kamino.rs converts at its boundary.
klend-interface = { git = "https://github.com/Kamino-Finance/klend", rev = "a08760976f51a3a58c4a0c6ea27b4a0e565bca79" }
# The 2.x types klend-interface speaks, renamed so they cannot be mistaken for this crate's own.
solana-pubkey-v2 = { package = "solana-pubkey", version = "2.1" }
solana-instruction-v2 = { package = "solana-instruction", version = "2.1" }
# No marginfi crate: at the deployed commit its type crate pins solana-instruction =3.4.0, and
# LiteSVM needs ~3.5. See src/marginfi.rs.
# Orca's own client and math, for setup: instruction builders, PDAs, account decoders, quotes.
# orca_whirlpools_client 8.0.0, the latest release, requires solana-program ^3, so the tree below
# carries v3 Solana crates beside the v4 ones the rest of this file pins; cargo unifies each only
# where both sides tolerate the same version.
orca_whirlpools_client = "=8.0.0"
orca_whirlpools_core = "=2.1.1"

# `Snapshot::load` hashes about 25 MB; unoptimized, sha2 spends most of a second on it per load.
[profile.dev.package.sha2]
opt-level = 3
