{
    // Rules expected to prove, and the reachability rules of the ones edited since the last prover
    // run. None is confirmed: no prover job has run on this code (the last, 2026-09-20, ran on a
    // dirty branch long before it), and CI runs this conf only when the repository has a
    // CERTORAKEY secret. Every rule here should pass; a satisfy rule passes when the prover finds
    // the run it describes. Twins that must fail are in run-twins.conf.
    "msg": "Ballista: rules expected to prove (unconfirmed)",
    // Every conf uses the same prover settings:
    // - unsatCoresForAllAsserts: report which assumptions each proof used.
    // - solanaSkipCallRegInst: skip indirect calls. The binary's only `callx` are in core::fmt,
    //   which is never inlined and runs only on panic and Debug paths.
    // - solanaTACOptimize 2: the front end's own TAC optimizations.
    // - solanaStackSize 4096: SBPF v0's frame. The prover then stops at any access past 4 KiB
    //   instead of modelling a frame the chain never gives; build-sbf.sh fails the build first.
    //   The confs used 8192 while invoke_cpi's frame was 4,736 bytes, before 1246a0f.
    // - solanaTACMathInt: exact mathematical-integer summaries of compiler-rt's __multi3 and
    //   __udivti3, which the u128 and mul_div rules depend on.
    "loop_iter": "8",
    "optimistic_loop": false,
    "smt_timeout": "6000",
    "cargo_tools_version": "v1.53",
    "rule_sanity": "basic",
    "java_args": [
        "-Dlevel.sbf=info"
    ],
    "prover_args": [
        "-unsatCoresForAllAsserts true",
        "-solanaSkipCallRegInst true",
        "-solanaTACOptimize 2",
        "-solanaStackSize 4096",
        "-solanaTACMathInt true"
    ],
    "rule": [
        "rule_u64_arithmetic_is_checked",
        "rule_i64_arithmetic_is_checked",
        "rule_i64_division_reports_zero_and_overflow",
        "rule_arithmetic_rejects_mixed_and_non_numeric_operands",
        "rule_u64_comparisons_match_rust",
        "rule_i64_comparisons_match_rust",
        "rule_ordering_is_numeric_only",
        "rule_casts_succeed_exactly_when_the_value_fits",
        "rule_u64_integer_operations_match_rust",
        "rule_error_codes_round_trip",
        "rule_runtime_error_codes_carry_context_and_stay_in_range",
        "rule_verifier_error_codes_are_distinct_and_in_range",
        "rule_parse_checks_magic_then_version_first",
        "rule_short_payloads_are_truncated_not_misparsed",
        "rule_parsed_sections_exactly_consume_the_payload",
        "rule_parsed_sections_reach_a_parsed_payload",
        "rule_parsed_sections_reach_a_row_input"
    ]
}
