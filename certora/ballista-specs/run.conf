{
    "msg": "Ballista v3: executor typing, verifier, account constraints, lifecycle",
    "loop_iter": "8",
    "optimistic_loop": false,
    "smt_timeout": "6000",
    "cargo_tools_version": "v1.53",
    "rule_sanity": "basic",
    "java_args": [
        "-Dlevel.sbf=info"
    ],
    "prover_args": [
        "-unsatCoresForAllAsserts true",
        "-solanaSkipCallRegInst true",
        "-solanaTACOptimize 2",
        "-solanaStackSize 8192",
        "-solanaTACMathInt true",
        "-solanaAggressiveGlobalDetection true",
        "-solanaOptimisticJoin true",
        "-solanaOptimisticOverlaps true",
        "-solanaOptimisticMemcpyPromotion true",
        "-solanaOptimisticMemcmp true",
        "-solanaOptimisticNoMemmove true"
    ],
    "rule": [
        "rule_signer_constraints_require_signers",
        "rule_writable_and_executable_constraints_are_enforced",
        "rule_pinned_address_and_owner_are_enforced",
        "rule_minimum_data_length_is_enforced",
        "rule_account_count_must_match_the_schema",
        "rule_account_header_reads_return_the_account_fields",
        "rule_u64_arithmetic_is_checked",
        "rule_i64_arithmetic_is_checked",
        "rule_u128_arithmetic_is_checked",
        "rule_arithmetic_rejects_mixed_and_non_numeric_operands",
        "rule_u64_comparisons_match_rust",
        "rule_i64_comparisons_match_rust",
        "rule_ordering_is_numeric_only",
        "rule_casts_succeed_exactly_when_the_value_fits",
        "rule_error_codes_round_trip",
        "rule_decoded_errors_partition_by_range",
        "rule_verifier_error_codes_are_distinct_and_in_range",
        "rule_finalized_templates_reject_chunk_writes",
        "rule_finalized_templates_cannot_be_cancelled",
        "rule_uploading_templates_never_run",
        "rule_run_never_writes_the_template_account",
        "rule_parse_checks_magic_then_version_first",
        "rule_short_payloads_are_truncated_not_misparsed",
        "rule_parsed_sections_exactly_consume_the_payload",
        "rule_verified_pure_instructions_preserve_register_typing",
        "rule_verified_account_reads_preserve_register_typing"
    ]
}
